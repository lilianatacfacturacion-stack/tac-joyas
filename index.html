<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a96e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TAC JOYAS">
  <title>TAC JOYAS</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/screens.css">
</head>
<body>
  <div id="pin-screen" style="display:none;position:fixed;inset:0;background:#1a1a1a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Georgia',serif;">
    <div style="color:#c9a96e;font-size:1.1rem;letter-spacing:0.3em;margin-bottom:0.5rem;">✦ TAC JOYAS</div>
    <div style="color:#888;font-size:0.75rem;letter-spacing:0.2em;margin-bottom:2.5rem;">DISEÑO ARTESANAL · LÁSER</div>
    <div style="color:#ccc;font-size:0.85rem;letter-spacing:0.15em;margin-bottom:1.2rem;">INTRODUCE TU PIN</div>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="6"
      style="background:#2a2a2a;border:1px solid #c9a96e44;border-radius:8px;color:#c9a96e;font-size:1.5rem;letter-spacing:0.4em;text-align:center;padding:0.7rem 1.2rem;width:160px;outline:none;"
      placeholder="······" autocomplete="off" />
    <div id="pin-error" style="color:#e05c5c;font-size:0.8rem;margin-top:0.8rem;min-height:1.2rem;letter-spacing:0.1em;"></div>
    <button onclick="checkPin()"
      style="margin-top:1.2rem;background:#c9a96e;color:#1a1a1a;border:none;border-radius:8px;padding:0.7rem 2rem;font-size:0.9rem;letter-spacing:0.15em;cursor:pointer;">
      ENTRAR
    </button>
  </div>
  <div id="app" style="display:none;"></div>
  <script>
    (function() {
      var PIN = '161725';
      var KEY = 'tacjoyas_auth';
      function checkPin() {
        var val = document.getElementById('pin-input').value;
        if (val === PIN) {
          sessionStorage.setItem(KEY, '1');
          document.getElementById('pin-screen').style.display = 'none';
          document.getElementById('app').style.display = '';
        } else {
          document.getElementById('pin-error').textContent = 'PIN incorrecto';
          document.getElementById('pin-input').value = '';
          document.getElementById('pin-input').focus();
        }
      }
      window.checkPin = checkPin;
      document.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem(KEY) === '1') {
          document.getElementById('pin-screen').style.display = 'none';
          document.getElementById('app').style.display = '';
        } else {
          document.getElementById('pin-screen').style.display = 'flex';
        }
        document.getElementById('pin-input').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') checkPin();
        });
      });
    })();
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
